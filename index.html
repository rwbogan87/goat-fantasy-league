<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOAT Fantasy Football</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0a0e1a;
      --surface:   #111827;
      --card:      #161e2e;
      --card2:     #1c2436;
      --border:    #1e2d45;
      --text:      #e8edf5;
      --muted:     #64748b;
      --accent:    #3b82f6;
      --accent2:   #60a5fa;
      --gold:      #f59e0b;
      --green:     #22c55e;
      --red:       #ef4444;
      --retired:   #374151;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,0.12), transparent),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(96,165,250,0.06), transparent);
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('field.jpg') center center / cover no-repeat;
      opacity: 0.5;
      z-index: -1;
      pointer-events: none;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      padding: 52px 20px 36px;
      position: relative;
    }
    header::after {
      content: '';
      display: block;
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 20px auto 0;
      border-radius: 2px;
    }
    .league-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.8rem, 7vw, 5rem);
      letter-spacing: 4px;
      color: var(--text);
      line-height: 1;
      text-shadow: 0 0 60px rgba(59,130,246,0.35);
    }
    .league-name span { color: var(--accent2); }
    .league-sub {
      font-size: 0.78rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ── NAV ── */
    .nav-wrap {
      display: flex;
      justify-content: center;
      gap: 0;
      margin: 0 auto 36px;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
    }
    .nav-wrap button {
      flex: 1;
      padding: 11px 0;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-wrap button.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px rgba(59,130,246,0.4);
    }
    .nav-wrap button:not(.active):hover { color: var(--text); }

    /* ── YEAR FILTER ── */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      padding: 0 20px;
    }
    .filter-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .champs-banner {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 24px;
    }
    .banner-stat { display: flex; align-items: baseline; gap: 6px; }
    .banner-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      color: var(--accent2);
    }
    .banner-label {
      font-size: 0.68rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .banner-sep { color: var(--border); font-size: 1.1rem; }
    .controls label {
      font-size: 0.78rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .controls select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .controls select:focus { border-color: var(--accent); }
    .controls .toggle-retired {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .controls .toggle-retired.on {
      border-color: var(--accent);
      color: var(--accent2);
    }

    /* ── MAIN ── */
    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* ── SECTION HEADER ── */
    .section-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .section-head h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: var(--accent2);
    }
    .section-head .pill {
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(59,130,246,0.12);
      color: var(--accent2);
      border: 1px solid rgba(59,130,246,0.25);
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* ── TABLE CARD ── */
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      margin-bottom: 32px;
    }
    .table-scroll {
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .table-scroll::-webkit-scrollbar { height: 5px; }
    .table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      white-space: nowrap;
    }

    /* ── HEADER ROW (years) ── */
    thead tr.year-row th {
      background: var(--bg);
      color: var(--accent2);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 2px;
      text-align: center;
      padding: 10px 0 6px;
      border-bottom: none;
    }
    thead tr.year-row th:first-child,
    thead tr.year-row th:nth-child(2) {
      color: var(--muted);
      font-size: 0.6rem;
      letter-spacing: 1px;
    }

    /* ── SUB-HEADER ROW (For/Against or Win/Loss) ── */
    thead tr.sub-row th {
      background: var(--surface);
      color: var(--muted);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      padding: 6px 12px 8px;
      border-bottom: 2px solid var(--border);
    }
    thead tr.sub-row th.name-col { text-align: left; padding-left: 20px; }

    /* ── DATA ROWS ── */
    tbody tr {
      border-bottom: 1px solid rgba(30,45,69,0.6);
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover td { background: rgba(59,130,246,0.05); }
    tbody tr.retired-row { opacity: 0.55; }
    tbody tr.retired-row:hover td { background: rgba(100,116,139,0.06); }
    tbody tr.memoriam-row td { color: rgba(245,158,11,0.55); }
    tbody tr.memoriam-row td.name-cell { color: rgba(245,158,11,0.7); }
    tbody tr.memoriam-row:hover td { background: rgba(245,158,11,0.04); }

    td {
      padding: 13px 12px;
      text-align: center;
      color: var(--text);
    }
    td.name-cell {
      text-align: left;
      padding-left: 20px;
      font-weight: 600;
      color: var(--text);
      min-width: 150px;
      position: sticky;
      left: 0;
      background: var(--card);
      z-index: 1;
    }
    tbody tr:hover td.name-cell { background: var(--card); }
    td.status-cell {
      padding: 0 8px 0 12px;
      position: sticky;
      left: 0;
      background: var(--card);
    }

    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }
    .status-dot.retired { background: var(--muted); box-shadow: none; }

    td.empty { color: var(--muted); font-size: 0.75rem; }

    /* FOR value styling */
    td.for-val { color: var(--accent2); font-weight: 500; }
    td.against-val { color: var(--muted); }

    /* Win/Loss */
    td.win-val { color: var(--green); font-weight: 600; }
    td.loss-val { color: #f87171; }

    /* Record totals */
    td.total-w { color: var(--green); font-weight: 700; }
    td.total-l { color: #f87171; font-weight: 700; }
    td.total-pts { color: var(--gold); font-weight: 700; }

    /* ── TOTALS COLUMN ── */
    td.totals-spacer { width: 12px; background: rgba(59,130,246,0.04); border-left: 1px solid var(--border); }
    th.totals-spacer { background: rgba(59,130,246,0.04); border-left: 1px solid var(--border); }

    /* ── VIEW TOGGLE ── */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* ── CHAMPS GRID ── */
    .champs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .champ-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 22px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      min-height: 420px;
    }
    .champ-card.in-memoriam {
      border-color: rgba(245,158,11,0.45);
      box-shadow: 0 8px 40px rgba(0,0,0,0.45), 0 0 24px rgba(245,158,11,0.12), inset 0 0 0 1px rgba(245,158,11,0.08);
      background: linear-gradient(160deg, #1a1a0f 0%, var(--card) 60%);
    }
    .champ-card.in-memoriam .champ-card-name {
      color: var(--gold);
    }
    .champ-honor-mark {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: linear-gradient(135deg, rgba(245,158,11,0.18), rgba(245,158,11,0.06));
      border-bottom-left-radius: 12px;
      border-top-right-radius: 15px;
      border-left: 1px solid rgba(245,158,11,0.25);
      border-bottom: 1px solid rgba(245,158,11,0.25);
      padding: 8px 8px 8px;
    }
    .champ-honor-mark .honor-icon {
      font-size: 0.9rem;
      line-height: 1;
      filter: drop-shadow(0 0 5px rgba(245,158,11,0.5));
    }
    .champ-honor-mark .honor-label {
      font-size: 0.52rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.8;
      white-space: nowrap;
    }
    .champ-card-name {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }
    .keeper-strip {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 110px;
      align-items: flex-start;
      padding-top: 4px;
      padding-bottom: 4px;
    }
    .keeper-item {
      width: 82px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      outline: none;
    }
    .keeper-item:focus-visible {
      outline: 2px solid rgba(96,165,250,0.85);
      outline-offset: 4px;
    }
    .keeper-photo {
      width: 82px;
      height: 82px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(15,23,42,0.85);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
      display: grid;
      place-items: center;
    }
    .keeper-photo.keeper-photo-empty {
      border-color: rgba(100,116,139,0.65);
      background: rgba(59,130,246,0.05);
      box-shadow: none;
    }
    .keeper-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .keeper-name {
      font-size: 0.72rem;
      line-height: 1.1;
      color: var(--text);
      text-align: center;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: opacity 0.18s ease, max-height 0.18s ease;
    }
    .keeper-year {
      font-size: 0.58rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }
    .keeper-item:hover .keeper-name,
    .keeper-item:focus-within .keeper-name {
      opacity: 1;
      max-height: 2rem;
    }
    .keeper-placeholder {
      min-height: 82px;
      width: 82px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      border: 1px dashed rgba(100,116,139,0.65);
      background: rgba(59,130,246,0.05);
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      padding: 10px;
    }
    .champ-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 64px;
      align-items: flex-start;
      justify-content: center;
    }
    .champ-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .champ-badge.championship {
      background: rgba(245,158,11,0.15);
      color: var(--gold);
      border: 1px solid rgba(245,158,11,0.3);
    }
    .champ-badge.scoring {
      background: rgba(59,130,246,0.12);
      color: var(--accent2);
      border: 1px solid rgba(59,130,246,0.25);
    }
    .champ-empty {
      color: var(--muted);
      font-size: 0.82rem;
      font-style: italic;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .champ-totals {
      display: flex;
      gap: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    .champ-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .champ-stat-val {
      font-size: 1.4rem;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
    }
    .champ-stat-val.gold { color: var(--gold); }
    .champ-stat-val.blue { color: var(--accent2); }
    .champ-stat-label {
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      gap: 20px;
      justify-content: flex-end;
      margin-bottom: 12px;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .legend .dot { width: 7px; height: 7px; border-radius: 50%; }
  </style>
</head>
<body>

<header>
  <div class="league-name">GOAT <span>Fantasy</span> Football</div>
  <div class="league-sub">All-Time League History &bull; 2013 – 2025</div>
</header>

<!-- NAV -->
<div class="nav-wrap">
  <button class="active" onclick="switchView('champs', this)">🏆 Championships</button>
  <button onclick="switchView('records', this)">📋 Records</button>
  <button onclick="switchView('points', this)">🎖️ Points</button>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="filter-controls" id="filter-controls" style="display:none">
    <label>Year:</label>
    <select id="yearFilter" onchange="render()">
      <option value="all">All Years</option>
    </select>
    <button class="toggle-retired" id="retiredToggle" onclick="toggleRetired()">Show Retired</button>
  </div>
  <div class="champs-banner" id="champs-banner"></div>
</div>

<main>
  <!-- CHAMPIONSHIPS VIEW -->
  <div id="view-champs" class="view-section active">
    <div class="section-head">
      <h2>Championships &amp; Scoring Titles</h2>
      <span class="pill">All-Time Honors</span>
    </div>
    <div class="legend" aria-hidden="true" style="visibility:hidden">&nbsp;</div>
    <div class="champs-grid" id="champs-grid"></div>
  </div>

  <!-- POINTS VIEW -->
  <div id="view-points" class="view-section">
    <div class="section-head">
      <h2>Season Points</h2>
      <span class="pill">Points For &amp; Against</span>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--accent2)"></span> Points For</span>
      <span><span class="dot" style="background:var(--muted)"></span> Points Against</span>
    </div>
    <div class="table-card">
      <div class="table-scroll">
        <table id="points-table"></table>
      </div>
    </div>
  </div>

  <!-- RECORDS VIEW -->
  <div id="view-records" class="view-section">
    <div class="section-head">
      <h2>Season Records</h2>
      <span class="pill">Win / Loss per Season</span>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span> Wins</span>
      <span><span class="dot" style="background:#f87171"></span> Losses</span>
    </div>
    <div class="table-card">
      <div class="table-scroll">
        <table id="records-table"></table>
      </div>
    </div>
  </div>
</main>

const keepersData = [];

async function loadKeepers() {
  try {
    const response = await fetch('keepers.json');
    if (!response.ok) throw new Error('Could not load keepers.json');
    const json = await response.json();
    if (Array.isArray(json)) keepersData.push(...json);
  } catch (error) {
    console.warn('Keeper data unavailable:', error);
  }
}

function switchView(view, btn) {
  currentView = view;
  document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-wrap button').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  btn.classList.add('active');
  document.getElementById('filter-controls').style.display = view === 'champs' ? 'none' : 'flex';
  document.getElementById('champs-banner').style.display = view === 'champs' ? 'flex' : 'none';
  render();
}

function applyRetiredVisibility() {
  ['points-table', 'records-table'].forEach(id => {
    const table = document.getElementById(id);
    if (!table) return;
    table.querySelectorAll('tr.retired-row').forEach(row => {
      row.style.display = showRetired ? '' : 'none';
    });
  });
}

function toggleRetired() {
  showRetired = !showRetired;
  const btn = document.getElementById('retiredToggle');
  btn.textContent = showRetired ? 'Hide Retired' : 'Show Retired';
  btn.classList.toggle('on', showRetired);
  applyRetiredVisibility();
}

function getSelectedYears() {
  const v = yearSelect.value;
  return v === 'all' ? ALL_YEARS : [v];
}

// ── RENDER POINTS TABLE ──
function renderPoints() {
  const years = getSelectedYears();
  const data = POINTS_DATA;
  const table = document.getElementById('points-table');
  table.innerHTML = '';

  // Header
  const thead = document.createElement('thead');

  // Year row
  const yearRow = document.createElement('tr');
  yearRow.className = 'year-row';
  yearRow.innerHTML = `<th></th><th>Player</th>`;
  years.forEach(y => {
    const th = document.createElement('th');
    th.colSpan = 2;
    th.textContent = y;
    yearRow.appendChild(th);
  });
  // Totals header
  const totTh = document.createElement('th');
  totTh.colSpan = 2;
  totTh.className = 'totals-spacer';
  totTh.textContent = 'CAREER';
  totTh.style.cssText = 'color:var(--gold);font-family:"Bebas Neue",sans-serif;font-size:1rem;letter-spacing:2px;text-align:center;';
  yearRow.appendChild(totTh);
  thead.appendChild(yearRow);

  // Sub row
  const subRow = document.createElement('tr');
  subRow.className = 'sub-row';
  subRow.innerHTML = `<th></th><th class="name-col">Name</th>`;
  years.forEach(() => {
    subRow.innerHTML += `<th>PF</th><th>PA</th>`;
  });
  subRow.innerHTML += `<th class="totals-spacer" style="color:var(--gold)">PF</th><th style="color:var(--muted)">PA</th>`;
  thead.appendChild(subRow);
  table.appendChild(thead);

  // Body
  const tbody = document.createElement('tbody');
  data.forEach(player => {
    // Only show if they have data in selected years
    const hasData = years.some(y => player.seasons[y]);
    if (!hasData && years.length < ALL_YEARS.length) return;

    const tr = document.createElement('tr');
    if (player.status === 'Retired') tr.classList.add('retired-row');
    if (player.name === 'Branden Irvin') tr.classList.add('memoriam-row');

    let totalFor = 0, totalAgainst = 0;

    let html = `<td class="status-cell"><span class="status-dot ${player.status === 'Retired' ? 'retired' : ''}"></span></td>`;
    html += `<td class="name-cell">${player.name}</td>`;

    years.forEach(y => {
      const s = player.seasons[y];
      if (s) {
        totalFor += parseFloat(s.for) || 0;
        totalAgainst += parseFloat(s.against) || 0;
        html += `<td class="for-val">${parseFloat(s.for).toFixed(1)}</td>`;
        html += `<td class="against-val">${parseFloat(s.against).toFixed(1)}</td>`;
      } else {
        html += `<td class="empty">—</td><td class="empty">—</td>`;
      }
    });

    // Totals
    html += `<td class="total-pts totals-spacer">${totalFor.toFixed(1)}</td>`;
    html += `<td class="total-l">${totalAgainst.toFixed(1)}</td>`;

    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  applyRetiredVisibility();
}

function renderRecords() {
  const years = getSelectedYears();
  const data = RECORDS_DATA;
  const table = document.getElementById('records-table');
  table.innerHTML = '';

  const thead = document.createElement('thead');

  // Year row
  const yearRow = document.createElement('tr');
  yearRow.className = 'year-row';
  yearRow.innerHTML = `<th></th><th>Player</th>`;
  years.forEach(y => {
    const th = document.createElement('th');
    th.colSpan = 2;
    th.textContent = y;
    yearRow.appendChild(th);
  });
  const totTh = document.createElement('th');
  totTh.colSpan = 3;
  totTh.className = 'totals-spacer';
  totTh.textContent = 'CAREER';
  totTh.style.cssText = 'color:var(--gold);font-family:"Bebas Neue",sans-serif;font-size:1rem;letter-spacing:2px;text-align:center;';
  yearRow.appendChild(totTh);
  thead.appendChild(yearRow);

  // Sub row
  const subRow = document.createElement('tr');
  subRow.className = 'sub-row';
  subRow.innerHTML = `<th></th><th class="name-col">Name</th>`;
  years.forEach(() => {
    subRow.innerHTML += `<th>W</th><th>L</th>`;
  });
  subRow.innerHTML += `<th class="totals-spacer" style="color:var(--green)">W</th><th style="color:#f87171">L</th><th style="color:var(--gold)">Win%</th>`;
  thead.appendChild(subRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  data.forEach(player => {
    const hasData = years.some(y => player.seasons[y]);
    if (!hasData && years.length < ALL_YEARS.length) return;

    const tr = document.createElement('tr');
    if (player.status === 'Retired') tr.classList.add('retired-row');
    if (player.name === 'Branden Irvin') tr.classList.add('memoriam-row');

    let totalW = 0, totalL = 0;
    let html = `<td class="status-cell"><span class="status-dot ${player.status === 'Retired' ? 'retired' : ''}"></span></td>`;
    html += `<td class="name-cell">${player.name}</td>`;

    years.forEach(y => {
      const s = player.seasons[y];
      if (s) {
        totalW += parseInt(s.win) || 0;
        totalL += parseInt(s.loss) || 0;
        html += `<td class="win-val">${s.win}</td><td class="loss-val">${s.loss}</td>`;
      } else {
        html += `<td class="empty">—</td><td class="empty">—</td>`;
      }
    });

    const pct = totalW + totalL > 0 ? ((totalW / (totalW + totalL)) * 100).toFixed(1) : '—';
    html += `<td class="total-w totals-spacer">${totalW}</td>`;
    html += `<td class="total-l">${totalL}</td>`;
    html += `<td class="total-pts">${pct !== '—' ? pct + '%' : '—'}</td>`;

    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  applyRetiredVisibility();
}

// ── RENDER CHAMPS ──
function renderChamps() {
  const grid = document.getElementById('champs-grid');
  grid.innerHTML = '';

  // Sort: most championships first, then scoring titles as tiebreak
  const sorted = [...CHAMPS_DATA].sort((a, b) =>
    (b.championships.length - a.championships.length) ||
    (b.scoringTitles.length - a.scoringTitles.length)
  );

  sorted.forEach(player => {
    const card = document.createElement('div');
    const inMemoriam = player.name === 'Branden Irvin';
    card.className = 'champ-card' + (inMemoriam ? ' in-memoriam' : '');

    const honorMark = inMemoriam
      ? `<div class="champ-honor-mark">
           <span class="honor-icon">🕯️</span>
           <span class="honor-label">Legend</span>
         </div>`
      : '';
    const nameLine = `<div class="champ-card-name">${player.name}</div>`;

    const champBadges = player.championships.sort().map(y =>
      `<span class="champ-badge championship">🏆 ${y}</span>`
    ).join('');

    const scoreBadges = player.scoringTitles.sort().map(y =>
      `<span class="champ-badge scoring">🎖️ ${y}</span>`
    ).join('');

    const badgeSection = (champBadges || scoreBadges)
      ? `<div class="champ-badge-row">${champBadges}${scoreBadges}</div>`
      : `<div class="champ-empty">No titles yet</div>`;

    const keeperInfo = keepersData.find(k => k.owner === player.name) || { keepers: [] };
    const keeperItems = keeperInfo.keepers.slice(0, 3).map(keeper => `
      <div class="keeper-item" tabindex="0">
        <div class="keeper-photo">
          <img src="${getKeeperPhotoUrl(keeper.espnId)}" alt="${keeper.name}" loading="lazy"
               onerror="this.onerror=null; this.src='${getKeeperFallbackUrl()}'; this.parentElement.classList.add('keeper-photo-empty'); console.warn('Keeper photo failed for ${keeper.name}');" />
        </div>
        <div class="keeper-name">${keeper.name}</div>
        <div class="keeper-year">${keeper.firstKeptYear}</div>
      </div>
    `);

    while (keeperItems.length < 3) {
      keeperItems.push(`
        <div class="keeper-item" tabindex="0">
          <div class="keeper-photo keeper-photo-empty">
            <span class="keeper-placeholder">None</span>
          </div>
          <div class="keeper-name">None</div>
          <div class="keeper-year">—</div>
        </div>
      `);
    }

    const keeperSection = `<div class="keeper-strip">${keeperItems.join('')}</div>`;

    const totals = `
      <div class="champ-totals">
        <div class="champ-stat">
          <span class="champ-stat-val gold">${player.championships.length}</span>
          <span class="champ-stat-label">Championships</span>
        </div>
        <div class="champ-stat">
          <span class="champ-stat-val blue">${player.scoringTitles.length}</span>
          <span class="champ-stat-label">Scoring Titles</span>
        </div>
      </div>`;

    card.innerHTML = honorMark + nameLine + badgeSection + keeperSection + totals;
    grid.appendChild(card);
  });
}

async function init() {
  await loadKeepers();
  render();
}

function render() {
  if (currentView === 'champs') renderChamps();
  else if (currentView === 'points') renderPoints();
  else renderRecords();
}

init();
</script>
</body>
</html>
